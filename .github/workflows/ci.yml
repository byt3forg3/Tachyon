name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # RUST WORKSPACE — fmt, clippy, build, test
  # ============================================================================
  workspace-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3 nodejs default-jdk golang

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build Workspace
        run: cargo build --verbose --workspace --locked

      - name: Run Release Tests (Workspace)
        run: cargo test --release --workspace --lib --bins --tests --all-features --locked
        env:
          RUST_BACKTRACE: 1

      - name: Install cargo-audit & cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Security Check (cargo audit)
        run: cargo audit

      - name: License & Dependency Check (cargo deny)
        run: cargo deny check

  # ============================================================================
  # COMPATIBILITY — declared MSRV and pure no_std build
  # ============================================================================
  msrv-check:
    name: "MSRV (Rust 1.89)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Rust 1.89 Toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Check Tachyon with all features
        run: cargo check -p tachyon --all-features --locked

  no-std-check:
    name: "no_std"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Check Tachyon without default features
        run: cargo rustc -p tachyon --no-default-features --lib --crate-type rlib --locked

  # ============================================================================
  # C REFERENCE — AddressSanitizer build, portable backend, smoke test
  # ============================================================================
  c-reference-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install ASan-capable GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build C Reference with ASan/UBSan + Portable (forced)
        run: |
          gcc -o asan_test \
            algorithms/tachyon/c-reference/tachyon_dispatcher.c \
            algorithms/tachyon/c-reference/tachyon_portable.c \
            algorithms/tachyon/c-reference/main.c \
            -I algorithms/tachyon/c-reference \
            -fsanitize=address,undefined -fno-sanitize-recover=all -g -O1 -Wall -Wextra -Werror \
            -DFORCE_PORTABLE

      - name: Smoke-test under ASan and UBSan
        run: |
          EXPECTED="Tachyon Hash: 3138c10ba15fe7d7fad8c7fc380474a0be7737a4e6296d246304ed767903e85b"
          OUTPUT=$(./asan_test "abc")
          echo "Output: $OUTPUT"
          test "$OUTPUT" = "$EXPECTED"
          echo "✓ ASan smoke test passed"
